name: Muse Mobile Code

on:
  repository_dispatch:
    types: [muse_mobile]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: muse-mobile-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  muse:
    if: ${{ github.event.client_payload.job_id != '' && github.event.client_payload.claim_token != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      CLAIM_TOKEN: ${{ github.event.client_payload.claim_token }}
      BRIDGE_URL: ${{ github.event.client_payload.bridge_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Claim Muse job
        shell: bash
        run: |
          set -euo pipefail
          SPEC="$RUNNER_TEMP/muse-spec.json"
          curl --fail-with-body -sS -X POST "$BRIDGE_URL" \
            -H "Authorization: Bearer $CLAIM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jobId "$JOB_ID" '{action:"claim",jobId:$jobId}')" > "$SPEC"

          API_KEY="$(jq -r '.apiKey // empty' "$SPEC")"
          MODEL="$(jq -r '.model // empty' "$SPEC")"
          MAX_STEPS="$(jq -r '.maxModelSteps // 32' "$SPEC")"
          if [ -z "$API_KEY" ] || [ -z "$MODEL" ]; then
            echo "Muse claim did not return a usable credential/model."
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/meta_key"
          chmod 600 "$RUNNER_TEMP/meta_key"
          jq -r '.prompt' "$SPEC" > "$RUNNER_TEMP/muse-task.txt"

          echo "MUSE_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "MUSE_MAX_STEPS=$MAX_STEPS" >> "$GITHUB_ENV"

          curl --fail-with-body -sS -X POST "$BRIDGE_URL" \
            -H "Authorization: Bearer $CLAIM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jobId "$JOB_ID" '{action:"update",jobId:$jobId,status:"running"}')" >/dev/null

      - name: Install Muse Code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dev.meta.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/muse" --version

      - name: Run Muse Code
        shell: bash
        run: |
          set -euo pipefail
          META_API_KEY="$(cat "$RUNNER_TEMP/meta_key")" \
            "$HOME/.local/bin/muse" exec \
              --model "$MUSE_MODEL" \
              --workspace "$GITHUB_WORKSPACE" \
              --trust-workspace \
              --disable-approval \
              --sandbox-network restricted \
              --max-model-steps "$MUSE_MAX_STEPS" \
              --prompt-file "$RUNNER_TEMP/muse-task.txt" \
              2>&1 | tee "$RUNNER_TEMP/muse.log"

      - name: Protect workflow files
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows 2>/dev/null || true

      - name: Create branch and pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BRANCH="muse/mobile-${JOB_ID:0:8}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "summary=Muse Code completed; no repository changes were required." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "GOMENG Muse Bot"
          git config user.email "gomeng-muse-bot@users.noreply.github.com"
          git commit -m "Muse mobile task ${JOB_ID:0:8}"
          git push origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "Muse mobile: ${JOB_ID:0:8}" \
            --body "Generated by Muse Code from the authenticated GOMENG mobile control plane. Review the diff and CI before merging.")"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "summary=Muse Code completed and opened a reviewable pull request." >> "$GITHUB_OUTPUT"

      - name: Report completion
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ steps.pr.outputs.branch }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          SUMMARY="${{ steps.pr.outputs.summary }}"
          curl --fail-with-body -sS -X POST "$BRIDGE_URL" \
            -H "Authorization: Bearer $CLAIM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg jobId "$JOB_ID" \
              --arg branch "$BRANCH" \
              --arg prUrl "$PR_URL" \
              --arg summary "$SUMMARY" \
              '{action:"update",jobId:$jobId,status:"completed",branch:$branch,prUrl:$prUrl,summary:$summary}')" >/dev/null

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          set +e
          ERROR="Muse Code GitHub Actions run failed. Check the workflow log for this run."
          if [ -f "$RUNNER_TEMP/muse.log" ]; then
            LAST="$(tail -n 12 "$RUNNER_TEMP/muse.log" | tr '\n' ' ' | cut -c1-1200)"
            ERROR="$ERROR $LAST"
          fi
          curl -sS -X POST "$BRIDGE_URL" \
            -H "Authorization: Bearer $CLAIM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jobId "$JOB_ID" --arg error "$ERROR" '{action:"update",jobId:$jobId,status:"failed",error:$error}')" >/dev/null
